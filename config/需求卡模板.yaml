# ============================================================
# 需求卡模板：一次运行 = 一个客户的一套完整工作流
# 复制本文件为 <客户名>_需求卡.yaml，按注释填写后运行：
#   python src/run.py config/<客户名>_需求卡.yaml
# ============================================================

客户: 客户名/品牌名          # 用于输出目录命名
业务简介: |
  一句话业务描述 + 出镜人设，例如：
  杭州做全铝蜂窝板厨房柜与阳台柜定制，老板亲自出镜，
  提供上门测量、设计、生产、安装一体化服务。

卖点:                       # 脚本里可以强调的点
  - 全铝蜂窝板耐潮耐用
  - 免费上门测量

人设: 老板出镜，直接口语化，先结论后解释，少术语

客户标签:                    # 关键标签，注入生成约束脚本更贴合客户形象
  - 实在直说
  - 现场实测

人设档案:                    # 语言风格约束（让脚本"像客户本人说的话"）
  口头禅:                    # 客户常说的话，可自然带入口播
    - 你记住了
  语气: 直白、口语化、不绕弯子
  表达习惯: 先结论后解释、短句为主

平铺开场黑名单:            # 自定义"平铺开场"词（客户自称/口头禅），首镜头命中则判弱钩子并重写
  - 我是某某
  - 今天某某

客户画像:                    # 粗筛对标账号/视频时按此匹配（关键！）
  专攻行业: 全铝蜂窝板厨房柜/阳台柜定制、不锈钢橱柜   # 客户做什么生意
  品牌特点: 杭州本地、源头工厂、老板亲自出镜、免费上门测量、一天装好  # 差异化标签
  可拍摄场景:                 # 客户实际能拍出什么样的画面（决定对标视频能否复现）
    - 展厅样柜实拍
    - 工厂车间/板材工艺
    - 安装现场/客户厨房
    - 量房/沟通现场
    - 板材五金特写

目标客户: 杭州首次装修、小户型的家庭

对标账号:                    # 主页链接（douyin.com/user/... 或分享链接），采集该账号爆款
  - https://www.douyin.com/user/MS4wLjABAAAAxxxx
  # - 另一个对标账号链接

关键词:                      # 抖音站内搜索关键词，采集搜索结果
  - 厨房装修避坑
  - 全铝蜂窝板橱柜

排除规则: 纯家居探店；与业务无关的泛内容；明显广告搬运

采集设置:
  每个来源最多视频数: 20     # 每个对标账号/关键词最多采多少条
  最低点赞: 1000             # 低于该点赞数仅保留不推荐
  滚动上限: 15               # 每个来源最多滚动次数
  搜索刷视频每关键词上限: 50 # 搜索驱动模式（默认）：每关键词最多采多少条，像人刷视频
  搜索刷视频滚动上限: 30     # 搜索驱动模式：每关键词滚动次数
  语料扩充每号条数: 40       # 语料扩充(collect_more)每号最多采条数
  语料扩充最低赞: 300        # 语料扩充进入转写候选的最低点赞
  语料扩充转写上限: 30       # 语料扩充转写候选上限

筛选设置:                    # 专项一：找对标的量化预筛指标
  爆款系数阈值: 3            # 视频赞 ÷ 账号作品中位数赞 ≥ 此值视为账号级爆款
  互动率阈值: 0.03           # (赞+评+转) ÷ 播放 ≥ 此值（播放缺失不计）
  发布时间硬门槛月数: 24     # 发布超过此月数需人工确认

生成设置:
  赛道数: 3                  # 试水期：聚类出几个内容赛道
  每赛道脚本数: 5            # 每个赛道生成几条脚本
  脚本时长秒: "30-60"        # 每条脚本口播时长（按约4字/秒换算字数）
  主攻赛道: ""               # 聚焦模式（试水复盘后）：填赛道名则只生成该赛道
  fewshot_脚本xlsx: ""       # 可选：已有的人工脚本 Excel（学格式和语气），如 示例脚本.xlsx
  CTA选项库:                # 结尾互动引导选项（脚本结尾从中选一）；缺省用通用兜底
    - "私信我，免费上门测量，先量再定方案"
    - "点关注，下期讲X"

转写设置:
  引擎: auto                 # auto=有豆包ASR密钥用豆包，否则本地whisper；或指定 doubao / whisper
  语言: zh

视觉设置:                    # 视觉拆解层（GLM 看帧，看懂画面内容）
  模型: glm-4v-flash         # 免费档；拆解质量不满意可换 glm-4.5v（按量计费）
  抽帧间隔秒: 5            # 每几秒抽一帧给视觉模型看

语料扩充账号:                # collect_more 语料来源账号（每项 昵称 + sec_uid）；无则复用 account_pool.json
  # - 昵称: 某某官方号
  #   sec_uid: MS4wLjABAAAAxxxx
